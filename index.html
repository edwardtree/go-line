<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>小樹老師 LINE</title>
<!--
  這一頁在做什麼（2026-09-24）
  ---------------------------------
  家長在 Messenger 私訊裡點連結 → Messenger 用它自己的內建瀏覽器打開網頁，
  而 Meta 的內建瀏覽器故意不讓「點一下就開別的 App」成立（Branch 2026-08、Chottulink 2026-07），
  LINE 自家的 line.me 頁面又只會呼叫已淘汰的 line:// → 30 幾位家長卡在「請啟動 LINE 應用程式」。

  這頁的做法（來源：shalanah/inapp-debugger 實測表，iOS 2026-03-07、Android 2024-11-07）：
    iPhone  的 Messenger 放行 x-safari-https://  → 把家長送到 Safari，Safari 上 line.me 是 Universal Link → 直接開 LINE
    Android 的 Messenger 放行 intent://          → 直接叫出 LINE，沒裝就退回 line.me
    不在內建瀏覽器（已經是 Safari/Chrome）        → 直接去 line.me，系統會開 LINE
  家長只需要點一次。頁面上仍留三顆按鈕當保險：自動跳失敗、或家長回上一頁時還有路可走。

  修改這頁之後要重新 push 到 GitHub Pages 才會生效（本機檔案改了沒用）。
  加 ?debug=1 可以看到頁面判斷出什麼、走了哪一條，而且不會自動跳。
-->
<style>
  :root{color-scheme:light}
  body{margin:0;background:#f7f7f5;font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#222}
  .wrap{max-width:420px;margin:0 auto;padding:36px 20px 40px;text-align:center}
  .logo{width:72px;height:72px;border-radius:18px;background:#06c755;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;letter-spacing:1px}
  h1{font-size:20px;margin:18px 0 6px}
  p{font-size:15px;line-height:1.7;margin:0 0 14px;color:#444}
  .btn{display:block;width:100%;box-sizing:border-box;padding:16px;border-radius:14px;font-size:18px;font-weight:700;text-decoration:none;margin:10px 0}
  .p{background:#06c755;color:#fff}
  .s{background:#fff;color:#06c755;border:2px solid #06c755}
  .t{background:#fff;color:#555;border:1px solid #ccc;font-size:15px;font-weight:600}
  .id{font-family:ui-monospace,Menlo,monospace;font-size:22px;background:#fff;border:1px dashed #aaa;border-radius:10px;padding:12px;margin:8px 0;user-select:all;-webkit-user-select:all}
  .small{font-size:13px;color:#777;margin-top:18px}
  #dbg{display:none;text-align:left;font-size:12px;color:#666;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:16px;word-break:break-all}
  .spin{display:none;margin:12px auto;width:28px;height:28px;border:3px solid #cfe;border-top-color:#06c755;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">LINE</div>
  <h1>正在幫你打開 LINE…</h1>
  <p id="lead">加入小樹老師的 LINE 官方帳號，馬上收到講義領取步驟。</p>
  <div class="spin" id="spin"></div>

  <a class="btn p" id="btnMain" href="https://line.me/R/ti/p/%40979dxwrf">👉 點我打開 LINE 加好友</a>
  <a class="btn s" id="btnAlt"  href="https://line.me/R/ti/p/%40979dxwrf">沒反應？用另一種方式開啟</a>

  <p style="margin-top:22px"><strong>還是打不開？</strong>直接在 LINE 搜尋 ID：</p>
  <div class="id" id="lineId">@979dxwrf</div>
  <a class="btn t" id="btnCopy" href="#">複製 ID（記得要有 @）</a>
  <p class="small">打開 LINE → 右上角「加入好友」→「搜尋」→ 貼上</p>

  <div id="dbg"></div>
</div>

<script>
(function () {
  var LINE_ID   = '@979dxwrf';
  var HTTPS     = 'https://line.me/R/ti/p/%40979dxwrf';                       // LINE 官方唯一支援格式（line:// 已淘汰）
  var SAFARI    = 'x-safari-' + HTTPS;                                         // iPhone：從 Messenger 跳到 Safari
  var INTENT    = 'intent://ti/p/%40979dxwrf#Intent;scheme=line;package=jp.naver.line.android;'
                + 'S.browser_fallback_url=' + encodeURIComponent(HTTPS) + ';end';   // Android：直接叫 LINE，沒裝退回網頁
  var CHROME_ESC= 'intent:' + HTTPS + '#Intent;scheme=https;end';              // Android 備援：先跳出內建瀏覽器到 Chrome

  var ua = navigator.userAgent || '';
  var isIOS     = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var inMeta    = /FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Threads/i.test(ua);   // Facebook／Messenger／Instagram／Threads 內建瀏覽器
  var inLINE    = /\bLine\//i.test(ua);
  var debug     = /[?&]debug=1/.test(location.search);

  var main = document.getElementById('btnMain');
  var alt  = document.getElementById('btnAlt');
  var lead = document.getElementById('lead');
  var plan = '', target = '';

  if (inLINE) {
    plan = '已經在 LINE 裡面了，直接開好友頁';
    target = HTTPS; main.href = HTTPS; alt.href = HTTPS;
  } else if (isIOS && inMeta) {
    plan = 'iPhone 的 Messenger/FB/IG 內建瀏覽器 → 用 x-safari-https 跳到 Safari，再由 Safari 開 LINE';
    target = SAFARI; main.href = SAFARI; alt.href = HTTPS;
    alt.textContent = '沒跳出去？改用這個';
  } else if (isAndroid && inMeta) {
    plan = 'Android 的 Messenger/FB/IG 內建瀏覽器 → 用 intent:// 直接叫出 LINE';
    target = INTENT; main.href = INTENT; alt.href = CHROME_ESC;
    alt.textContent = '沒反應？先用 Chrome 開啟';
  } else if (isIOS) {
    plan = 'iPhone 一般瀏覽器 → line.me 是 Universal Link，系統會直接開 LINE';
    target = HTTPS; main.href = HTTPS; alt.href = HTTPS;
  } else if (isAndroid) {
    plan = 'Android 一般瀏覽器 → 直接用 intent:// 叫 LINE';
    target = INTENT; main.href = INTENT; alt.href = HTTPS;
  } else {
    plan = '電腦或其他裝置 → 顯示 QR／ID，不自動跳';
    target = ''; main.href = HTTPS; alt.style.display = 'none';
    lead.textContent = '請用手機打開這一頁，或在 LINE 搜尋下面的 ID。';
    document.querySelector('h1').textContent = '加入小樹老師的 LINE';
  }

  document.getElementById('btnCopy').addEventListener('click', function (e) {
    e.preventDefault();
    var done = function () { e.target.textContent = '✔ 已複製 ' + LINE_ID + '，去 LINE 貼上'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(LINE_ID).then(done, done);
    else { var r = document.createRange(); r.selectNodeContents(document.getElementById('lineId')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand('copy'); } catch (_) {} done(); }
  });

  if (debug) {
    var d = document.getElementById('dbg'); d.style.display = 'block';
    d.innerHTML = '<b>判斷</b>：' + plan + '<br><b>會跳去</b>：' + (target || '（不跳）') + '<br><b>UA</b>：' + ua;
    document.querySelector('h1').textContent = '（除錯模式，不自動跳）';
    return;
  }

  // 自動跳：頁面一載入就走。留 350ms 讓按鈕先畫出來，萬一跳轉被擋家長也有東西可按。
  if (target) {
    document.getElementById('spin').style.display = 'block';
    setTimeout(function () { location.href = target; }, 350);
    // 2.5 秒後還在這頁，代表自動跳被擋了 → 換標題提示手動按
    setTimeout(function () {
      document.getElementById('spin').style.display = 'none';
      document.querySelector('h1').textContent = '請點下面的綠色按鈕';
    }, 2500);
  }
})();
</script>
</body>
</html>
